# Language-server catalogue.
#
# One entry per server. The manager starts the first command it finds on PATH or in the common
# install locations, in the language's project root. `languages` maps ScratchRunner language ids
# (crates/language) to the protocol's languageId. `virtual_paths`/`virtual_path` say where an
# unsaved document lives inside its virtual workspace; `scaffold` adds the project file the
# server needs for a single file.
#
# `args` may contain {root} (the workspace root) and {cache} (the app's cache directory).

[[server]]
id = "python"
name = "Pyright"
commands = ["pyright-langserver", "basedpyright-langserver"]
args = ["--stdio"]
install_hint = "Install Pyright: npm install -g pyright, or pip install pyright."
root_markers = ["pyrightconfig.json", "pyproject.toml", "setup.py", "setup.cfg", "requirements.txt", ".git"]
virtual_path = "main.py"

[server.languages]
python = "python"

[server.settings.python]
diagnosticMode = "openFilesOnly"
useLibraryCodeForTypes = true

[server.settings.python.analysis]
autoImportCompletions = true
autoSearchPaths = true
typeCheckingMode = "basic"

[[server]]
id = "typescript"
name = "TypeScript Language Server"
commands = ["typescript-language-server"]
args = ["--stdio"]
install_hint = "Install Node.js, then npm install -g typescript typescript-language-server."
root_markers = ["tsconfig.json", "jsconfig.json", "package.json", ".git"]
scaffold = "tsconfig"

[server.languages]
javascript-browser = "javascript"
javascript-jquery = "javascript"
javascript-node = "javascript"
typescript-browser = "typescript"
typescript-node = "typescript"

[server.virtual_paths]
javascript-browser = "main.js"
javascript-jquery = "main.js"
javascript-node = "main.js"
typescript-browser = "main.ts"
typescript-node = "main.ts"

[server.initialization_options]
hostInfo = "ScratchRunner"
disableAutomaticTypingAcquisition = true

[server.settings.typescript.preferences]
includePackageJsonAutoImports = "on"

[server.settings.javascript.preferences]
includePackageJsonAutoImports = "on"

[[server]]
id = "shell"
name = "bash-language-server"
commands = ["bash-language-server"]
args = ["start"]
install_hint = "Install Node.js, then npm install -g bash-language-server (and shellcheck for diagnostics)."
root_markers = [".git", "Makefile"]
virtual_path = "main.sh"

[server.languages]
shell = "shellscript"

[server.settings.bashIde]
globPattern = "**/*@(.sh|.inc|.bash|.command)"

[[server]]
id = "rust"
name = "rust-analyzer"
commands = ["rust-analyzer"]
args = []
install_hint = "Install the Rust toolchain and rust-analyzer: rustup component add rust-analyzer."
root_markers = ["Cargo.toml", "rust-project.json"]
virtual_path = "src/main.rs"
scaffold = "cargo"

[server.languages]
rust = "rust"

[server.settings.rust-analyzer]
checkOnSave = false

[server.settings.rust-analyzer.cargo]
allFeatures = false

[server.settings.rust-analyzer.procMacro]
enable = false

[[server]]
id = "go"
name = "gopls"
commands = ["gopls"]
args = []
install_hint = "Install Go, then go install golang.org/x/tools/gopls@latest."
root_markers = ["go.mod", "go.work", ".git"]
virtual_path = "main.go"
scaffold = "go"

[server.languages]
go = "go"

[server.initialization_options]
usePlaceholders = true
completeUnimported = true

[server.settings.gopls]
usePlaceholders = true
completeUnimported = true
staticcheck = false

[[server]]
id = "clangd"
name = "clangd"
commands = ["clangd"]
args = ["--log=error"]
install_hint = "Install the Xcode command line tools (xcode-select --install) or LLVM (brew install llvm)."
root_markers = ["compile_commands.json", ".clangd", "CMakeLists.txt", "Makefile", ".git"]
search_paths = ["/Applications/Xcode.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin"]

[server.languages]
c = "c"
cpp = "cpp"
objective-c = "objective-c"
objective-cpp = "objective-cpp"

[server.virtual_paths]
c = "main.c"
cpp = "main.cpp"
objective-c = "main.m"
objective-cpp = "main.mm"

[server.initialization_options]
clangdFileStatus = true

[[server]]
id = "swift"
name = "sourcekit-lsp"
commands = ["sourcekit-lsp"]
args = []
install_hint = "Install Xcode or the Swift toolchain (sourcekit-lsp ships with it)."
root_markers = ["Package.swift", ".git"]
virtual_path = "main.swift"
search_paths = ["/Applications/Xcode.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin"]

[server.languages]
swift = "swift"

[[server]]
