[package]
name = "scratch-navigator"
description = "Reusable macOS file navigator for ScratchRunner"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
nsh-core.workspace = true
nsh-base.workspace = true
scratch-ui-kit = { path = "../ui-kit" }
