[package]
name = "scratch-runner"
description = "ScratchRunner's run engine: compile stages, PTY execution, environment contract, preflight."
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
publish = false

[lints]
workspace = true

[dependencies]
libc = "0.2"
scratch-language = { path = "../language" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
serde_json = "1"
