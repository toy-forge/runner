[package]
name = "scratch-diagnostics"
description = "ScratchRunner's diagnostics engine: output parsers, annotations, fixes, scheduling and runner for lint and compile errors."
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
publish = false

[lints]
workspace = true

[dependencies]
scratch-language = { path = "../language" }
libc = "0.2"
quick-xml = "0.42"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
toml = "0.9"

[dev-dependencies]
