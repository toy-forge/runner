[package]
name = "scratch-commands"
description = "ScratchRunner command registry, menu model, key bindings, compound-command interpreter, fuzzy matcher and command palette. No UI dependency."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
fancy-regex = "0.16"
plist = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
toml = "0.9"
uuid = { version = "1", features = ["v5"] }

[dev-dependencies]
tempfile = "3"
