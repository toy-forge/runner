[package]
name = "scratch-language"
description = "ScratchRunner's data-driven language system: definitions, run/compile specs, detection, templates, registry."
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
publish = false

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.9"
thiserror = "2"
regex = "1"
plist = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
