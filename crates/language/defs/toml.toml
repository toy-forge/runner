# Editor-only.
id = "toml"
name = "TOML"
extensions = ["toml"]
filenames = ["Cargo.lock", "Pipfile"]
modelines = ["toml"]
content_patterns = [
  '@2 (?m)^\[{1,2}[A-Za-z0-9_.-]+\]{1,2}\s*$',
  '@2 (?m)^[A-Za-z_][\w-]*\s*=\s*("|\d|true|false|\[)',
]
editor_syntax = "TOML"
grammar = "source.toml"

[comments]
line = "#"
