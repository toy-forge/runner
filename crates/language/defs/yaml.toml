# Editor-only.
id = "yaml"
name = "YAML"
extensions = ["yaml", "yml"]
modelines = ["yaml", "yml"]
content_patterns = [
  '@2 (?m)\A---\s*$',
  '@2 (?m)^[A-Za-z_][\w-]*:\s+\S',
  '(?m)^\s*-\s+[A-Za-z_][\w-]*:\s+\S',
]
editor_syntax = "YAML"
grammar = "source.yaml"
tab_width = 2
soft_tabs = true
custom_tab_mode = true

[comments]
line = "#"
