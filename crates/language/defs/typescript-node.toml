id = "typescript-node"
uuid = "8CF92C94-BDD9-4CAB-B52D-271639671821"
name = "TypeScript (Node.js)"
extensions = ["ts", "mts", "cts", "tsx"]
default_for = ["ts", "mts", "cts", "tsx"]
shebangs = ["ts-node", "tsx", "deno", "bun"]
modelines = ["typescript", "ts"]
content_patterns = [
  '@3 (?m)^\s*(export\s+)?(interface|type)\s+\w+(<[^>]*>)?\s*(=|\{)',
  '@2 (?m)^\s*(const|let|var)\s+\w+\s*:\s*(string|number|boolean|any|unknown|void|\w+\[\]|Array<)',
  '@2 \)\s*:\s*(string|number|boolean|void|Promise<[^>]*>)\s*(\{|=>)',
  '\b(readonly|private|public|protected)\s+\w+\s*:\s*\w+',
]
editor_syntax = "TypeScript"
grammar = "source.ts"
requires_external_components = true

[comments]
line = "//"
block = ["/*", "*/"]

[run]
command = "node $compiler"

[run.env]
path_append = ["/opt/homebrew/bin", "/usr/local/bin"]

[run.compile]
kind = "steps"

[[run.compile.steps]]
name = "Compile"
program = "tsc"
args = ["--outDir", "$build_dir", "$flags", "$filename"]
missing_tool = "Could not find the TypeScript compiler (tsc). Install it with \"npm install -g typescript\" (Node.js is available from https://nodejs.org)."
produces = { value = "$build_dir/$stem.js", must_exist = true, missing_message = "The TypeScript compiler did not produce a JavaScript file." }

[[diagnostics]]
id = "console-text"
name = "Console Text"
kind = "console_text"
update = { on_run = true }
output_mode = "regex"
regex = '^(?<file>[^\s].*?)\((?<line>\d+),(?<column>\d+)\): (((?<error>error)|(?<warning>warning)|(?<note>note|notice)) ((?<messageID>TS\w+): )?)?(?<message>.*)$'

[[diagnostics]]
id = "compile"
name = "Compile Script"
kind = "compile_script"
update = { on_edit = true, on_run = true }
options = { cancel_on_errors = true }
output_mode = "regex"
regex = '^(?<file>[^\s].*?)\((?<line>\d+),(?<column>\d+)\): (((?<error>error)|(?<warning>warning)|(?<note>note|notice)) ((?<messageID>TS\w+): )?)?(?<message>.*)$'

[[docs]]
name = "TypeScript Handbook"
type = "bookmark"
url = "https://www.typescriptlang.org/docs/handbook/intro.html"
