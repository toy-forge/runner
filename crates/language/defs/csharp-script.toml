id = "csharp-script"
uuid = "A65D203A-FC0C-4F0C-A080-41863424566E"
name = "C# (.NET Script)"
extensions = ["csx"]
shebangs = ["dotnet-script"]
modelines = ["csx"]
editor_syntax = "C#"
grammar = "source.cs"
requires_external_components = true

[comments]
line = "//"
block = ["/*", "*/"]

[run]
command = "dotnet-script $filename"

[run.env]
path_append = ["$home/.dotnet/tools", "/usr/local/share/dotnet", "/opt/homebrew/bin"]

[errors]
"127" = "To run code in this language, you need to have .NET and dotnet-script installed. To install .NET, download it from https://dotnet.microsoft.com/. Once installed, you can install the dotnet-script tool by running the following terminal command: dotnet tool install -g dotnet-script"

[[diagnostics]]
id = "console-text"
name = "Console Text"
kind = "console_text"
update = { on_run = true }
output_mode = "regex"
regex = '^(?<file>[^\s].*?)\((?<line>\d+),(?<column>\d+)\): (((?<error>error)|(?<warning>warning)|(?<note>note|notice)) (?<messageID>\w+\d+): ?)?(?<message>.*)$'

[[templates]]
name = ".NET Script"
extension = "csx"
default = true
text = "#!/usr/bin/env dotnet-script\n\n<##>"

[[templates]]
name = "Class"
extension = "csx"
name_on_creation = true
text = "class ___FILEBASENAME___\n{\n\t<##>\n}\n"
