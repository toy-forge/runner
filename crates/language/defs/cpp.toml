id = "cpp"
uuid = "EC55AB59-7920-4862-B7EB-963CD4BB928A"
name = "C++"
extensions = ["cpp", "cc", "cp", "cxx", "c++", "h", "hh", "hpp", "h++"]
modelines = ["cpp", "c++"]
content_patterns = [
  '@2 (?m)^\s*#\s*include\s*<(iostream|vector|string|map|set|memory|algorithm|sstream|fstream|cstdio|cstdlib)>',
  '@2 \bstd::\w+',
  '(?m)^\s*using\s+namespace\s+\w+',
  '\bc(out|err|in)\s*(<<|>>)',
  '(?m)^\s*template\s*<',
  '(?m)^\s*(class|struct)\s+\w+\s*(:\s*(public|private|protected)\s+\w+\s*)?\{',
]
editor_syntax = "C++"
grammar = "source.c++"
debugger = "lldb"

[comments]
line = "//"
block = ["/*", "*/"]

[run]
command = "$compiler"
flags = "-std=c++11"

[run.compile]
kind = "steps"
strip_flags = ["-cr-noautoinclude", "-sr-noautoinclude"]

[[run.compile.bindings]]
name = "sources"
source = { kind = "local_sources", family = "cpp", disable_flags = ["-cr-noautoinclude", "-sr-noautoinclude"] }

[[run.compile.steps]]
name = "Compile"
via = ["xcrun"]
program = "clang++"
args = ["-o", "$output", "-x", "c++", "$sources", "-lc++", "$flags", "-fno-caret-diagnostics", "-fno-diagnostics-show-option", "-fmessage-length=0"]
debug_args = ["-g"]
missing_tool = "Could not find the C++ compiler. Install Apple's command line developer tools by running \"xcode-select --install\" in Terminal."
produces = { value = "$output" }

[[diagnostics]]
id = "clang"
name = "Clang"
kind = "clang"
update = { on_edit = true, on_run = true }
options = { cancel_on_errors = true }
output_mode = "unix"
regex = '^(?<file>[^\s].*?):(?<line>\d+):(?<column>\d+):? (?<message>.*)$'

[[templates]]
name = "Main File"
extension = "cpp"
default = true
text = "#include <iostream>\n\nusing namespace std;\n\nint main(int argc, char *argv[]) {\n\t<##>\n}"

[[templates]]
name = "Header"
extension = "h"
text = "#ifndef ____FILEBASENAME_______FILEEXTENSION____\n#define ____FILEBASENAME_______FILEEXTENSION____\n\n<##>\n\n#endif"

[[templates]]
name = "Class"
extension = "h"
name_on_creation = true
text = "#ifndef ____FILEBASENAME_______FILEEXTENSION____\n#define ____FILEBASENAME_______FILEEXTENSION____\n\nclass ___FILEBASENAME___ {\npublic:\n\t___FILEBASENAME___();\n\tvirtual ~___FILEBASENAME___();\n\n\t<##>\n};\n\n#endif"

[[templates]]
name = "Class"
extension = "cpp"
name_on_creation = true
text = "#include \"___FILEBASENAME___.h\"\n\n___FILEBASENAME___::___FILEBASENAME___() {\n}\n\n___FILEBASENAME___::~___FILEBASENAME___() {\n}\n"

[[templates]]
name = "Header-CPP Pair"
extension = "h"
name_on_creation = true
text = "#ifndef ____FILEBASENAME_______FILEEXTENSION____\n#define ____FILEBASENAME_______FILEEXTENSION____\n\n<##>\n\n#endif"

[[templates]]
name = "Header-CPP Pair"
extension = "cpp"
name_on_creation = true
text = "#include \"___FILEBASENAME___.h\"\n\n"
