[package]
name = "scratch-search"
description = "ScratchRunner's find/replace engine, project search and replace, fuzzy matching, QuickNav providers and symbol extraction. NSH-free."
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
publish = false

[lints]
workspace = true

[dependencies]
fancy-regex = "0.16"
regex = "1"
ignore = "0.4"
encoding_rs = "0.8"
memchr = "2"
thiserror = "2"
serde = { version = "1", features = ["derive"] }

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
libc = "0.2"

[target.'cfg(unix)'.dependencies]
xattr = "1"

[dev-dependencies]
tempfile = "3"
serde_json = "1"
